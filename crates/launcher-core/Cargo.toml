[package]
name = "launcher-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Domain and application layers of the Panas RPG launcher. No I/O frameworks allowed here."

[dependencies]
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
md-5 = "0.10"
# Only to run the game watcher in the background; the runtime itself is provided by the host app.
tokio = { version = "1", default-features = false, features = ["rt", "sync"] }

[dev-dependencies]
tokio = { workspace = true }
